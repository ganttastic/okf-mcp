# Tag a version (git tag v0.1.0 && git push --tags) and this publishes a
# GitHub Release carrying two artifacts:
#
#   okf-mcp.tgz     prebuilt npm tarball at a stable URL —
#                   npx https://github.com/ganttastic/okf-mcp/releases/latest/download/okf-mcp.tgz
#                   installs it with no auth, no clone, and no build step.
#                   Bundle repositories run their §11 conformance gate from it.
#   okf-mcp.mcpb    the Claude Desktop installer (generic, unconfigured).
#
# Releases rather than the GitHub npm registry deliberately: that registry
# requires authentication to install even public packages, which would force a
# PAT into every wiki-template clone's CI. Release assets are plain URLs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Pack npm tarball
        run: |
          npm pack
          cp okf-mcp-*.tgz okf-mcp.tgz

      - name: Pack desktop bundle
        run: npm run pack:mcpb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "okf-mcp ${GITHUB_REF_NAME}" \
            --generate-notes \
            okf-mcp.tgz \
            okf-mcp-*.tgz \
            build/okf-mcp.mcpb

  # Fan-out: tell every registered bundle repository to rebuild its
  # preconfigured installer (they listen for repository_dispatch type
  # okf-mcp-release and call build-installer.yml back here).
  #
  # Needs two pieces of repo config, and skips cleanly without them:
  #   INSTALLER_REPOS   repository variable, space-separated owner/repo list
  #   INSTALLER_DISPATCH_TOKEN   secret; PAT able to dispatch to those repos
  # (GITHUB_TOKEN cannot dispatch cross-repository, hence the PAT.)
  notify-installers:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to bundle repositories
        env:
          GH_TOKEN: ${{ secrets.INSTALLER_DISPATCH_TOKEN }}
          REPOS: ${{ vars.INSTALLER_REPOS }}
        run: |
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${REPOS:-}" ]; then
            echo "INSTALLER_DISPATCH_TOKEN secret or INSTALLER_REPOS variable not set; skipping fan-out."
            exit 0
          fi
          for repo in $REPOS; do
            echo "dispatching okf-mcp-release to $repo"
            gh api "repos/$repo/dispatches" \
              -f event_type=okf-mcp-release \
              -F "client_payload[tag]=${GITHUB_REF_NAME}"
          done
